name: Coleta diaria

# 7h de Brasilia, com repique as 7h30.
#
# O repique roda a coleta inteira de novo, nao so o que falhou. Pode fazer
# isso porque a gravacao e append-only com indice unico: o que ja entrou e
# ignorado, o que faltou entra. Repetir e barato; perder o dia nao volta.
#
# Brasilia e UTC-3 e nao tem mais horario de verao, entao 7h = 10h UTC.
#
# HORARIO QUEBRADO DE PROPOSITO. Cron em minuto zero de hora cheia cai na
# fila mais disputada do GitHub Actions, que e best-effort e nao garante
# hora. Medido aqui: em 01/10 a coleta agendada para 10:00 UTC rodou as
# 16:50, com 6h20 de atraso, e o aviso saiu 17:12 em vez de 11:00 - a
# ordem coleta-antes-do-aviso se manteve por sorte, nao por desenho.
# Minuto fora da hora cheia pega fila curta.

# O AGENDAMENTO SAIU DAQUI. Quem marca a hora e diario.yml, que roda
# coleta, repique, aviso e tela em sequencia - agendamento separado
# nao garante ordem, e em 04/10 o aviso saiu no meio da coleta e
# contou 2 de 6 operadoras.
#
# Este arquivo fica para rodar o passo sozinho quando for preciso.

on:
  workflow_dispatch:

# Se o repique comecar com a coleta ainda rodando, espera em vez de
# atropelar - duas rodadas simultaneas brigariam pelo mesmo indice unico.
concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar o navegador
        # Unifique e NuCel escondem os precos atras de JavaScript e exigem
        # navegador de verdade. As outras quatro nao usam isto.
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Coletar e gravar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python robo.py --coletar

      - name: Avisar se a coleta falhou
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'FIM'
          import os, urllib.parse, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          texto = ("Price Tracker: a COLETA FALHOU inteira.\n"
                   "Nenhum dado foi gravado nesta rodada.\n"
                   "Ver: github.com/dashboardtmt/tmt-price-tracker/actions")
          urllib.request.urlopen(urllib.request.Request(
              "https://api.telegram.org/bot%s/sendMessage" % token,
              data=urllib.parse.urlencode({"chat_id": chat, "text": texto}).encode()),
              timeout=30)
          FIM
