name: Aviso diario

# 8h de Brasilia (11h UTC), todo dia, mesmo sem novidade.
#
# Chegar todo dia e proposital: se a mensagem nao chegou, e porque algo
# quebrou. O silencio passa a ser o alarme.

# Minuto quebrado pelo mesmo motivo da coleta: hora cheia atrasa horas na
# fila do Actions, e aviso que chega antes da coleta acusa um robo parado
# que na verdade so esta na fila.

# O AGENDAMENTO SAIU DAQUI. Quem marca a hora e diario.yml, que roda
# coleta, repique, aviso e tela em sequencia - agendamento separado
# nao garante ordem, e em 04/10 o aviso saiu no meio da coleta e
# contou 2 de 6 operadoras.
#
# Este arquivo fica para rodar o passo sozinho quando for preciso.

on:
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Montar e enviar a mensagem
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # O e-mail e opcional: enquanto estes tres nao existirem, o
          # robo pula o envio e nada quebra.
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: |
          # o relatorio em PDF que vai anexado na mensagem
          pip install --quiet reportlab
          python robo.py --avisar
