# Correcao pontual: o tier do app nas capturas antigas.
#
# POR QUE EXISTE. Ate 15/10/2026 o tracker escrevia "Netflix (Padrao)" e
# "Spotify (Premium Individual)" por conta de um padrao no dicionario, sem
# nenhuma operadora ter declarado qual plano do app a oferta inclui. O
# coletor ja foi corrigido para ler o tier da fonte; isto recalcula o que
# ele gravou antes, e preenche apps_planos onde o tier ESTA declarado.
#
# NAO APAGA NADA e nao consulta vitrine nenhuma: reescreve dois campos
# derivados dentro do bruto (apps_rotulo e apps_planos) a partir do texto
# que ja esta gravado na propria linha.
#
# ESTE WORKFLOW E DESCARTAVEL. Depois de aplicar, apagar este arquivo e o
# corrigir_tier_apps.py.
#
# Rodar sem confirmacao faz a CONFERENCIA e grava zero. Para gravar,
# digite APLICAR.

name: Corrigir tier dos apps (uso unico)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Vazio = so conferir. Digite APLICAR para gravar.'
        required: false
        default: ''

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir (nao grava)
        if: ${{ github.event.inputs.confirmar != 'APLICAR' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python corrigir_tier_apps.py

      - name: Aplicar
        if: ${{ github.event.inputs.confirmar == 'APLICAR' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python corrigir_tier_apps.py --aplicar
