name: Corrigir nomes gravados

# Roda corrigir_nomes.py com os segredos do Supabase, que so existem
# aqui. Sem "aplicar", so conta as linhas que a tabela alcanca; com ele,
# grava e confere. Ver o cabecalho de corrigir_nomes.py.
#
# NAO MANDA MENSAGEM E NAO MEXE NA TELA. Depois de aplicar, o dado
# publicado so muda na proxima "Atualizar a tela" (ou na rotina diaria).

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Gravar a correcao (sem isto, so conta)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Corrigir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ inputs.aplicar }}" = "true" ]; then
            python corrigir_nomes.py --aplicar
          else
            python corrigir_nomes.py
          fi
