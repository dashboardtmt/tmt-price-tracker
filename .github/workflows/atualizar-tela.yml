name: Atualizar a tela

# Roda depois da coleta: le o banco, regera a tela e guarda no repositorio.
#
# NAO PUBLICA NADA. O arquivo fica no repositorio privado, e nada vai ao ar
# sem autorizacao explicita. O ganho e que a tela deixa de ser uma foto
# tirada na mao e passa a refletir o que esta gravado.

# O AGENDAMENTO SAIU DAQUI. Quem marca a hora e diario.yml, que roda
# coleta, repique, aviso e tela em sequencia - agendamento separado
# nao garante ordem, e em 04/10 o aviso saiu no meio da coleta e
# contou 2 de 6 operadoras.
#
# Este arquivo fica para rodar o passo sozinho quando for preciso.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exportar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python exportar.py --dias 90 --saida dados.json
      - name: Publicar o dado no Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python publicar_dados.py --dados dados.json
      - name: Regerar a tela
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # A pagina do Vercel busca o dado no Storage: publicada uma vez,
          # passa a mostrar a coleta de cada dia sem deploy novo. A copia
          # local segue com os dados dentro, para abrir sem rede.
          FONTE="${SUPABASE_URL%/}/storage/v1/object/public/tela/dados.json"
          python gerar_tela.py --dados dados.json --saida tela.html
          mkdir -p site
          python gerar_tela.py --dados dados.json --saida site/index.html --remoto "$FONTE"
          cp metodologia.html site/metodologia.html
      - name: Guardar no repositorio
        run: |
          git config user.name "dashboardtmt"
          git config user.email "leonardojdesousa@gmail.com"
          git add tela.html site
          if git diff --staged --quiet; then
            echo "tela sem mudanca - nada a guardar"
          else
            git commit -m "Tela atualizada com a coleta de $(date -u +%d/%m/%Y)"
            # puxa antes de empurrar: sem isto, qualquer push concorrente
            # derruba a rodada no ultimo passo, DEPOIS de a exportacao ja
            # ter publicado - e o job termina em vermelho como se tudo
            # tivesse falhado. A rotina diaria ja fazia isso.
            git pull --rebase --autostash
            git push
          fi
