# Correcao pontual: o banner "Claro Day" no nome das ofertas gravadas.
#
# POR QUE EXISTE. De 06 a 12/10/2026 a Claro rodou o "Claro Day" e colou
# o banner na frente do card. O nome e lido do comeco do texto, entao 834
# capturas foram gravadas como "Claro Day Claro Pos" e "Claro Day Claro
# Controle". Com outro nome a oferta vira outra identidade: a serie morre
# no dia 06 e ressuscita no dia 12, e a mesma oferta aparece duas vezes
# na tabela. Foi a maior fonte de buraco no historico.
#
# O coletor ja foi corrigido. Isto arruma o que ele gravou: tira o banner
# do nome e poe no campo "campanha", que existe no esquema desde o inicio
# e nunca tinha sido preenchido.
#
# NAO APAGA NADA e nao consulta vitrine nenhuma. Recusa gravar se alguma
# troca criar colisao no indice unico do banco.
#
# ESTE WORKFLOW E DESCARTAVEL. Depois de aplicar, apagar este arquivo e o
# corrigir_campanha.py.
#
# Rodar sem confirmacao faz a CONFERENCIA e grava zero.

name: Corrigir banner de campanha (uso unico)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Vazio = so conferir. Digite APLICAR para gravar.'
        required: false
        default: ''

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir (nao grava)
        if: ${{ github.event.inputs.confirmar != 'APLICAR' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python corrigir_campanha.py

      - name: Aplicar
        if: ${{ github.event.inputs.confirmar == 'APLICAR' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python corrigir_campanha.py --aplicar
