# Limpeza pontual: apaga as linhas de "Claro Pre 1 GB" e "Claro Pre 2 GB".
#
# POR QUE EXISTE. Esses dois planos nunca existiram. A varredura de texto
# do coletor da Claro casou com uma frase de FAQ da pagina do Prezao -
# "ao recarregar R$20,00 ganhe 1GB de bonus, R$25,00 ganhe 2GB de bonus"
# - e emparelhou o bonus de um degrau com o preco do degrau seguinte. O
# coletor ja foi corrigido; isto limpa o que ele gravou entre 01/10 e
# 07/10/2026.
#
# ESTE WORKFLOW E DESCARTAVEL. Depois de rodar uma vez, apagar o arquivo:
# a tabela e append-only por desenho, e deixar um gatilho de DELETE em
# producao parado no repositorio e risco sem contrapartida.
#
# O filtro e exato: operadora, produto e os dois nomes. Nenhuma outra
# linha pode casar.

name: Limpar Claro Pre (uso unico)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite APAGAR para confirmar'
        required: true
        default: ''

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a confirmacao
        if: ${{ github.event.inputs.confirmar != 'APAGAR' }}
        run: |
          echo "Confirmacao ausente. Nada foi apagado."
          exit 1

      - name: Contar, apagar e conferir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/")
          chave = os.environ["SUPABASE_SECRET_KEY"]
          # os dois nomes, e nada alem deles
          filtro = ("capturas?operadora=eq.Claro&produto=eq.prepago"
                    "&nome_oferta=in.(%s)"
                    % urllib.parse.quote('"Claro Pre 1 GB","Claro Pre 2 GB"'))

          def pedir(metodo, caminho, prefer):
              req = urllib.request.Request(url + "/rest/v1/" + caminho, method=metodo)
              req.add_header("apikey", chave)
              req.add_header("Authorization", "Bearer " + chave)
              req.add_header("Prefer", prefer)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, dict(r.headers), r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read().decode("utf-8", "replace")

          def contar():
              st, h, corpo = pedir("GET", filtro + "&select=id&limit=1", "count=exact")
              faixa = h.get("Content-Range", "")
              return st, (faixa.split("/")[-1] if "/" in faixa else "?"), corpo[:200]

          st, antes, erro = contar()
          print("ANTES: HTTP %s, linhas que casam o filtro: %s" % (st, antes))
          # 206 e o normal aqui: com count=exact e limit, o PostgREST
          # responde Partial Content, nao 200
          if st not in (200, 206):
              print("falhou ao contar:", erro)
              raise SystemExit(1)
          if antes in ("0", "?"):
              print("nada a apagar - saindo sem tocar no banco")
              raise SystemExit(0)

          # Um ultimo confere: mostrar o que vai embora
          st, h, amostra = pedir("GET", filtro + "&select=data_captura,praca,nome_oferta,preco_promocional&limit=5", "count=exact")
          print("amostra do que sera apagado:")
          for linha in json.loads(amostra):
              print("   ", linha)

          st, h, corpo = pedir("DELETE", filtro, "return=minimal")
          print("DELETE: HTTP %s %s" % (st, corpo[:200]))
          if st not in (200, 204):
              raise SystemExit(1)

          st, depois, _ = contar()
          print("DEPOIS: linhas que casam o filtro: %s" % depois)
          if depois != "0":
              print("ATENCAO: ainda sobraram linhas")
              raise SystemExit(1)
          print("ok: %s linha(s) apagada(s)" % antes)
          PY
