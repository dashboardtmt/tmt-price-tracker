# Os testes, a cada push e a cada pull request.
#
# POR QUE EXISTE. Em 20/10/2026 o projeto tinha quinze defeitos
# corrigidos e zero testes: cada correcao foi conferida uma vez, na mao,
# e o script de conferencia foi jogado fora. Nada impedia qualquer um
# deles de voltar.
#
# A suite cobre o que de fato quebrou: tier de app inventado, preco de
# beneficio virando preco de plano, banner de campanha no nome da
# oferta, velocidade perdida, corte de franquia passando batido, aviso
# cancelado por colisao, coleta rodando de madrugada.
#
# NAO TOCA A REDE NEM O BANCO. Roda em segundos, sem segredo nenhum - e
# por isso pode rodar em pull request de qualquer origem.
#
# O reportlab E NECESSARIO AQUI, mesmo nao sendo necessario para coletar:
# os testes do PDF se pulam sozinhos quando ele falta, e o provador de
# mutacoes reintroduz dois defeitos no relatorio.py exigindo que a suite
# fique vermelha. Com os testes pulados ela fica verde, o provador
# reporta "teste inutil" e derruba o build - dizendo que os testes nao
# servem, que e a mensagem certa para a situacao errada.

name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # DOIS JOBS, E ELES RODAM EM PARALELO. Eram um so, e em 27/10/2026 o
  # build foi CANCELADO aos 10m15s: o provador estourou o teto de 10
  # minutos do job, e com isso a suite - que passou em 40 segundos -
  # tambem nao reportou nada. Um passo lento derrubava o sinal rapido.
  #
  # Separados, a suite responde em menos de um minuto e o provador
  # entrega depois, sem segurar o retorno. Os dois continuam rodando em
  # todo push: minutos deixaram de ser medidos quando o repositorio
  # virou publico, entao nao ha o que economizar aqui.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # O node roda o JavaScript da tela num DOM de mentira
      # (testes/tela_em_node.mjs). Sem ele os testes dos tres canais se
      # pulam, e o provador reintroduz quatro defeitos da tela exigindo
      # vermelho: a suite fica verde e o build cai dizendo que os testes
      # nao servem. Mesma armadilha do reportlab, logo abaixo.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar o que o relatorio em PDF precisa
        run: pip install --quiet reportlab pypdf

      - name: Rodar a suite
        run: python -m unittest discover -s testes -v

  provador:
    runs-on: ubuntu-latest
    # MEDIDO, e nao chutado: 12min11s para as 136 mutacoes nesta
    # maquina, em 27/10/2026. Cada mutacao roda a suite inteira, entao
    # o tempo cresce nos DOIS eixos - mais testes e mais mutacoes. O
    # runner do GitHub e mais lento que a maquina onde isso foi medido,
    # e 35 minutos deixa folga para a suite crescer bastante antes de
    # alguem precisar mexer aqui de novo.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar o que o relatorio em PDF precisa
        run: pip install --quiet reportlab pypdf

      - name: Conferir que a suite serve para alguma coisa
        # reintroduz cada defeito real e exige que a suite fique
        # vermelha. Teste que nunca falha nao protege nada, e isso tem
        # de ser demonstrado e nao suposto.
        run: python testes/provar_a_suite.py
