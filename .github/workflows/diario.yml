name: Rotina diaria

# Coleta, repique, aviso e tela EM SEQUENCIA, num workflow so.
#
# Antes eram quatro agendamentos independentes, e isso tinha um defeito
# que apareceu em 04/10: o aviso das 8h rodou no meio da coleta e anunciou
# "2 de 2 operadoras, 992 ofertas" quando as seis estavam coletando e
# terminaram todas. A mensagem do dia saiu errada por chegar cedo.
#
# Agendamento independente nao tem como garantir ordem: a fila do GitHub
# Actions e best-effort e cada workflow atrasa o seu tanto. Medido aqui:
# atrasos de 4 a 6 horas, e desiguais entre si. Encadear por "needs" e a
# unica forma de o aviso ver a coleta terminada - nao depende de acertar
# horario nenhum.
#
# O repique roda a coleta inteira de novo porque a gravacao e append-only
# com indice unico: o que ja entrou e ignorado, o que faltou entra.
#
# NAO HA DEPLOY AQUI, de proposito. A pagina publicada busca o JSON no
# Supabase Storage em tempo de execucao, entao a coleta do dia aparece
# sem republicar nada. O Vercel se recusa a criar token de API a partir
# da sessao do CLI, e exigir que alguem gere um na mao seria pendurar a
# atualizacao diaria num passo manual - que e justamente o que nao pode.

# UMA COLETA POR DIA, MIRANDO AS 7H DA MANHA.
#
# A coleta leva ~50 minutos, entao precisa COMECAR perto das 6h para a
# mensagem chegar as 7h. So que o agendamento do GitHub nao cumpre
# horario: medido em sete dias, o evento chegou entre 3,5 e 9,6 horas
# atrasado. O atraso esta no gatilho, nao na fila - o run comeca no mesmo
# minuto em que e criado.
#
# Nao da para mandar o GitHub disparar as 6h. Da para decidir, a cada
# gatilho que chega, se e hora de coletar - e e isso que ja_coletou.py
# faz: recusa antes das 6h, libera entre 6h e 10h, e depois das 10h
# libera de qualquer jeito.
#
# Os horarios abaixo sao postos para que os atrasos tipicos facam os
# gatilhos CHEGAREM dentro da janela. Os mais cedo quase sempre so pagam
# a guarda, que custa meio minuto; eles existem para o dia de atraso
# grande, como a segunda-feira 12/10, quando o atraso foi de 9,6 horas.
#
# Minutos quebrados de proposito: a documentacao do GitHub aponta o
# inicio de cada hora como o pior momento da fila.
on:
  schedule:
    - cron: '34 1 * * *'    # marcado 22:34 BRT (do dia anterior)
    - cron: '7 4 * * *'     # marcado 01:07 BRT
    - cron: '41 5 * * *'    # marcado 02:41
    - cron: '13 7 * * *'    # marcado 04:13
    - cron: '47 8 * * *'    # marcado 05:47
    - cron: '22 10 * * *'   # marcado 07:22
    - cron: '56 11 * * *'   # marcado 08:56
    - cron: '29 13 * * *'   # marcado 10:29
  workflow_dispatch:
    inputs:
      so_avisar:
        description: >
          Reenviar a mensagem do dia sobre o dado que JA esta no banco,
          sem coletar nada. Use quando a mensagem saiu com defeito e o
          conserto ja esta no main.
        type: boolean
        default: false

concurrency:
  group: rotina-diaria
  cancel-in-progress: false

jobs:
  # A GUARDA. Decide se e hora de coletar: uma vez por dia, e nao antes
  # das 6h. Sem ela, os oito agendamentos coletariam oito vezes - e o
  # primeiro deles, que chega de madrugada, faria a mensagem do dia
  # chegar as 3h da manha.
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.ver.outputs.rodar }}
      travado: ${{ steps.ver.outputs.travado }}
      # SO AVISAR E DIFERENTE DE NAO RODAR. Com so_avisar, "rodar"
      # continua true - o aviso e a tela precisam dele - e "coletar"
      # vira false, que e o que mantem a coleta de fora.
      coletar: ${{ steps.ver.outputs.coletar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # o portao exercita os tres canais: a mensagem, o PDF e a tela
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar o que o relatorio em PDF precisa
        # o portao tem de exercitar o PDF tambem: ele e metade do que
        # chega todo dia, e teste pulado nao e teste passado
        run: pip install --quiet reportlab pypdf

      - name: Os testes passam?
        id: testes
        # Coletar com o codigo quebrado envenena a serie: a gravacao e
        # append-only, e dado errado fica para sempre. Perder um dia e
        # menos pior.
        #
        # MAS O JOB NAO PODE FALHAR AQUI. "decidir" falhando faz os oito
        # gatilhos pularem coleta, aviso e tela: o dia se perde e nao
        # chega mensagem nenhuma dizendo isso. Com continue-on-error o
        # resultado do teste vira um DADO que os outros jobs leem, e o
        # job "alerta" la embaixo conta o que aconteceu.
        continue-on-error: true
        run: python -m unittest discover -s testes

      - name: E hora de coletar?
        id: ver
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # CODIGO QUEBRADO NAO COLETA, e o dia fica marcado como travado
          # para o alerta poder contar isso.
          if [ "${{ steps.testes.outcome }}" != "success" ]; then
            echo "rodar=false" >> "$GITHUB_OUTPUT"
            echo "travado=true" >> "$GITHUB_OUTPUT"
            echo "os testes nao passam: nao coleta hoje"
            exit 0
          fi
          echo "travado=false" >> "$GITHUB_OUTPUT"
          # REENVIO DA MENSAGEM: nao coleta. O disparo na mao recoletava
          # o dia inteiro, e foi assim que 40 capturas repetidas
          # entraram no banco em 20/10/2026. Aqui so o aviso e a tela
          # rodam, sobre o dado que ja esta gravado.
          if [ "${{ inputs.so_avisar }}" = "true" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "coletar=false" >> "$GITHUB_OUTPUT"
            echo "so avisar: reenvia a mensagem sem coletar"
            exit 0
          fi
          echo "coletar=true" >> "$GITHUB_OUTPUT"
          # disparo na mao sempre roda: quem dispara sabe o que quer
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "disparo manual: roda de qualquer jeito"
            exit 0
          fi
          # a guarda decide: ja coletou hoje? e cedo demais? passou da
          # hora limite? a saida dela e "sim" ou "nao", e nada mais
          if [ "$(python ja_coletou.py)" = "sim" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=false" >> "$GITHUB_OUTPUT"
            echo "nao e hora - encerrando"
          fi

  # O DIA PERDIDO TEM DE FALAR. Roda so no ULTIMO gatilho do dia, e e
  # isso que garante uma mensagem em vez de oito: a condicao e o proprio
  # cron que disparou a rodada, sem depender de estado em lugar nenhum.
  #
  # Cobre os dois jeitos de o dia morrer calado: o portao de testes
  # barrando a coleta, e o proprio "decidir" quebrando antes de decidir
  # (checkout, setup-python, rede). Nos dois casos nao houve coleta e nao
  # houve aviso, e o unico sinal era um quadrado vermelho no painel.
  #
  # Curl cru de proposito: se o codigo esta quebrado, o aviso nao pode
  # depender do codigo.
  alerta:
    needs: decidir
    if: >
      always() && github.event.schedule == '29 13 * * *' &&
      (needs.decidir.result != 'success' ||
       needs.decidir.outputs.travado == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # O DIA PODE TER SIDO COLETADO ANTES DE QUEBRAR. A condicao acima
      # ve "decidir" desta rodada, e nao o dia: um commit que quebra um
      # teste as 11h, depois da coleta das 7h ter rodado e avisado,
      # fazia o alerta anunciar "O DIA NAO FOI COLETADO ... nada foi
      # gravado" sobre um dia inteiro coletado e reportado. E o curl
      # abaixo e cru de proposito, entao nada no caminho desmente.
      #
      # A guarda ja sabe a resposta: ela responde "nao" quando a rodada
      # do dia fechou. Perguntar antes de falar custa meio minuto.
      - name: O dia foi coletado, afinal?
        id: ver
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # A DATA A QUE ESTA RODADA PERTENCE, e nao a data de agora. O
          # gatilho esta marcado para 10:29 BRT; chegando com atraso
          # grande ele pode cair depois da meia-noite, e ai perguntar
          # "hoje" seria perguntar sobre o dia seguinte - que obviamente
          # nao foi coletado, mas tambem nao e o dia desta rodada. Antes
          # das 6h BRT a rodada pertence ao dia anterior.
          HORA=$(date -u -d '-3 hours' +%H)
          if [ "$HORA" -lt 6 ]; then
            DIA=$(date -u -d '-27 hours' +%F)
          else
            DIA=$(date -u -d '-3 hours' +%F)
          fi
          echo "a rodada pertence ao dia $DIA"
          # "--fechou" responde so o estado: aquele dia passou por todos
          # os coletores? Em caso de duvida ela responde "nao", e ai o
          # alerta sai - sem conseguir perguntar, o dia nao pode ser
          # declarado coletado.
          # "|| echo nao" porque o -e do Actions derrubaria o step com
          # qualquer saida diferente de zero - e ai o step que manda a
          # mensagem seria pulado e o dia perdido morreria calado, que e
          # o oposto do que esta escrito duas linhas acima (V4).
          FECHOU=$(python ja_coletou.py --fechou "$DIA" || echo nao)
          echo "dia=$DIA" >> "$GITHUB_OUTPUT"
          if [ "$FECHOU" = "sim" ]; then
            echo "falar=false" >> "$GITHUB_OUTPUT"
            echo "o dia fechou antes de quebrar - nada a alertar"
          else
            echo "falar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Contar que o dia nao foi coletado
        if: steps.ver.outputs.falar == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MOTIVO="a rotina nao conseguiu decidir se era hora de coletar"
          if [ "${{ needs.decidir.outputs.travado }}" = "true" ]; then
            MOTIVO="a suite de testes nao passou, e coletar com codigo quebrado gravaria dado errado numa serie que nao se corrige"
          fi
          # "NADA FOI GRAVADO" NAO E SABIDO AQUI. A guarda so fecha o
          # dia com os nove coletores registrados, entao oito
          # registrados - com mensagem entregue - tambem chegam neste
          # job. Dizer que nada foi gravado seria afirmar o que nao se
          # sabe; o que se sabe e que a rodada nao fechou.
          # a data vem do passo acima porque pode ser a de ontem, e o
          # texto diz QUAL dia em vez de "hoje" (V5)
          DIA_BR=$(date -u -d "${{ steps.ver.outputs.dia }}" +%d/%m)
          TEXTO="TMT Price Tracker - ${DIA_BR}
          A RODADA DE ${DIA_BR} NAO FECHOU.
          Motivo: ${MOTIVO}.
          Pode ter entrado dado parcial; o historico anterior segue intacto de qualquer jeito.
          Detalhes: ${RUN}"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXTO}" > /dev/null
          echo "alerta de dia perdido enviado"

  coleta:
    needs: decidir
    if: >
      needs.decidir.outputs.rodar == 'true' &&
      needs.decidir.outputs.coletar != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar o navegador (Unifique, NuCel e Claro Flex) e o leitor de PDF (TIM FIT)
        run: |
          pip install playwright pypdf
          playwright install --with-deps chromium
      - name: Coletar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python robo.py --coletar

  repique:
    needs: coleta
    # So quando a coleta nao fechou. Rodando sempre, o repique dobrava o
    # consumo do Actions: medidos 87 min/dia contra a cota de 2000/mes, o
    # que faria o robo parar por falta de minutos antes do fim do mes. Dia
    # em que tudo deu certo nao precisa de segunda tentativa, e o robo
    # agora sai com codigo de erro quando alguma operadora fica incompleta.
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar o navegador
        run: |
          pip install playwright pypdf
          playwright install --with-deps chromium
      - name: Repicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python robo.py --coletar

  aviso:
    # "decidir" entra no needs para a condicao poder le-lo: always()
    # ignora SKIPPED, entao sem isto o aviso sairia nas sete rodadas que
    # pulam a coleta - oito mensagens iguais por dia.
    needs: [repique, decidir]
    if: always() && needs.decidir.outputs.rodar == 'true'        # dia que falhou e dia que mais precisa de aviso
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Avisar no Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # O e-mail e opcional: enquanto estes tres nao existirem, o
          # robo pula o envio e nada quebra.
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_REMETENTE: ${{ secrets.RESEND_REMETENTE }}
        run: |
          # o relatorio em PDF que vai anexado na mensagem
          pip install --quiet reportlab
          python robo.py --avisar

  # A MENSAGEM QUE NAO SAIU TEM DE FALAR POR SI. "aviso" so roda com
  # rodar == 'true', e depois que a rodada fecha a guarda responde "nao"
  # em todos os gatilhos seguintes: o job fica skipped para sempre. Se o
  # --avisar falhar - sendMessage recusado, montar_mensagem levantando -
  # o dia tem coleta, tem PDF e nunca tem mensagem, e o unico sinal e o
  # quadrado vermelho no painel. Que e exatamente o modo de falhar que o
  # job "alerta" existe para eliminar.
  #
  # Roda na MESMA rodada do aviso, entao nao repete: uma falha, um
  # alerta. E o curl e cru porque o que falhou foi justamente o codigo
  # que manda mensagem.
  aviso_falhou:
    needs: aviso
    # O JOB CERTO. "failure()" sozinho quer dizer "algum job anterior do
    # grafo falhou", e o grafo do aviso passa por decidir, coleta e
    # repique: dia em que a coleta falha e o aviso sai normalmente
    # dispararia "A MENSAGEM DE HOJE NAO FOI GERADA" sobre uma mensagem
    # entregue - e no dia em que a coleta falhou e justamente quando a
    # pessoa precisa confiar na mensagem que recebeu.
    if: always() && needs.aviso.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contar que a mensagem do dia nao saiu
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # SO O QUE O JOB SABE. Este texto afirmava "a coleta rodou e
          # o dado esta gravado", "o painel esta atualizado" e "nada foi
          # perdido" - tres coisas que ele nao tem como saber: o aviso
          # roda com always(), inclusive no dia em que a coleta e o
          # repique falharam, e o job da tela roda DEPOIS deste. Era
          # trocar silencio por afirmacao falsa, que e pior.
          TEXTO="TMT Price Tracker - $(date -u -d '-3 hours' +%d/%m)
          A MENSAGEM DE HOJE NAO FOI GERADA.
          O passo que monta e envia o aviso falhou. Nao da para dizer daqui se a coleta do dia fechou nem se o painel foi atualizado - as duas coisas estao na rodada.
          Detalhes: ${RUN}"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXTO}" > /dev/null
          echo "alerta de aviso falhado enviado"

  tela:
    needs: [aviso, decidir]
    if: always() && needs.decidir.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exportar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python exportar.py --dias 90 --saida dados.json
      - name: Publicar o dado no Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python publicar_dados.py --dados dados.json
      - name: Regerar a tela
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # A pagina do Vercel busca o dado no Storage: publicada uma vez,
          # passa a mostrar a coleta de cada dia sem deploy novo. A copia
          # local segue com os dados dentro, para abrir sem rede.
          FONTE="${SUPABASE_URL%/}/storage/v1/object/public/tela/dados.json"
          python gerar_tela.py --dados dados.json --saida tela.html
          mkdir -p site
          python gerar_tela.py --dados dados.json --saida site/index.html --remoto "$FONTE"
          cp metodologia.html site/metodologia.html
      - name: Guardar no repositorio
        run: |
          git config user.name "dashboardtmt"
          git config user.email "leonardojdesousa@gmail.com"
          git add tela.html site
          if git diff --staged --quiet; then
            echo "tela sem mudanca - nada a guardar"
          else
            git commit -m "Tela atualizada com a coleta de $(date -u +%d/%m/%Y)"
            git pull --rebase --autostash
            git push
          fi

